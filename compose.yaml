name: gestor-incidencias

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidencias
      POSTGRES_USER: app
      POSTGRES_PASSWORD: practica123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datos
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U app -d incidencias"]
     interval: 5s
     timeout: 3s
     retries: 10
     start_period: 15s
    restart: unless-stopped

  backend:
    image: ivancorrales/cloud-incidencias-backend:1.0
    platform: linux/arm64
    environment: 
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: incidencias
      DB_USER: app
      DB_PASSWORD: practica123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - datos
    restart: unless-stopped

  frontend:
    image: ivancorrales/cloud-incidencias-frontend:1.0
    platform: linux/arm64
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - frontend
    

networks:
  frontend:
  datos:

volumes:
  postgres_data: